name: soulsync
description: SoulSync - A private relationship companion for couples.
publish_to: 'none'
version: 1.0.2+3

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  go_router: ^14.2.7
  supabase_flutter: ^2.5.3
  google_sign_in: ^6.2.1
  firebase_core: ^3.3.0
  firebase_messaging: ^15.1.0
  flutter_local_notifications: ^17.2.1
  image_picker: ^1.1.2
  cached_network_image: ^3.3.1
  intl: ^0.20.3
  shared_preferences: ^2.3.0
  http: ^1.2.2
  connectivity_plus: ^6.0.3
  uuid: ^4.4.2
  timeago: ^3.6.1
  shimmer: ^3.0.0
  lottie: ^3.1.2
  flutter_svg: ^2.0.10+1
  permission_handler: ^11.3.1
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  youtube_player_iframe: ^6.0.4
  wakelock_plus: ^1.5.2
  maplibre_gl: 0.22.0
  geolocator: ^14.0.2
  flutter_tts: ^4.2.5
  battery_plus: ^7.1.2
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.0
  riverpod_lint: ^2.3.10
  custom_lint: ^0.6.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
